<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roamo — Planlæg din drømmerejse på 10 minutter</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--sand:#F5F0E8;--ink:#1A1814;--terra:#C4622D;--terra-light:#F0E0D6;--muted:#7A7568;--brd:#E0D9CE;--green:#2D8A4E;--green-light:#E8F5EE;}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:#fff;color:var(--ink);overflow-x:hidden}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:#fff;border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:100}
    .logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700}
    .logo span{color:var(--terra)}
    .nav-cta{background:var(--terra);color:#fff;border:none;padding:0.55rem 1.4rem;border-radius:2rem;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;cursor:pointer;transition:background 0.2s}
    .nav-cta:hover{background:#A8501F}
    .hero{display:grid;grid-template-columns:1fr 1fr;min-height:88vh;align-items:center;overflow:hidden}
    .hero-left{padding:5rem 4rem 5rem 5rem;background:#fff}
    .hero-badge{display:inline-flex;align-items:center;gap:0.4rem;background:var(--green-light);color:var(--green);font-size:0.75rem;font-weight:600;padding:0.35rem 0.85rem;border-radius:2rem;margin-bottom:1.5rem}
    .hero-title{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,3.5vw,3.4rem);font-weight:700;line-height:1.08;margin-bottom:1.25rem}
    .hero-title em{font-style:italic;color:var(--terra)}
    .hero-sub{font-size:1.05rem;color:var(--muted);line-height:1.75;margin-bottom:2rem;max-width:440px;font-weight:300}
    .hero-cta{background:var(--terra);color:#fff;border:none;padding:1rem 2.4rem;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;border-radius:3rem;cursor:pointer;transition:all 0.2s}
    .hero-cta:hover{background:#A8501F;transform:translateY(-2px);box-shadow:0 8px 24px rgba(196,98,45,0.3)}
    .hero-cta-sub{font-size:0.78rem;color:var(--muted);margin-top:0.75rem}
    .hero-stats{display:flex;gap:2rem;margin-top:2.5rem;padding-top:2rem;border-top:1px solid var(--brd)}
    .stat-num{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700}
    .stat-label{font-size:0.78rem;color:var(--muted);margin-top:0.1rem}
    .hero-right{position:relative;height:100%;min-height:88vh;overflow:hidden}
    .hero-right img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.8s ease;position:absolute;inset:0}
    .hero-right img.active{opacity:1}
    .proof-bar{background:var(--sand);padding:1.25rem 2.5rem;display:flex;align-items:center;justify-content:center;gap:3rem;border-bottom:1px solid var(--brd);flex-wrap:wrap}
    .proof-item{display:flex;align-items:center;gap:0.6rem;font-size:0.85rem;color:var(--muted)}
    .chat-section{background:var(--sand);padding:5rem 2rem}
    .chat-inner{max-width:780px;margin:0 auto}
    .section-eye{font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--terra);margin-bottom:0.75rem;font-weight:500}
    .section-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,3vw,2.6rem);font-weight:700;margin-bottom:0.75rem;line-height:1.15}
    .section-sub{font-size:1rem;color:var(--muted);line-height:1.7;font-weight:300;margin-bottom:2rem}
    .chat-box{background:#fff;border:1px solid var(--brd);border-radius:1.25rem;overflow:hidden;box-shadow:0 4px 32px rgba(0,0,0,0.06)}
    .chat-msgs{min-height:300px;max-height:600px;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
    .msg{display:flex;gap:0.65rem;align-items:flex-start;animation:fadeUp 0.35s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{flex-direction:row-reverse}
    .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:500}
    .av.ai{background:var(--terra-light);color:var(--terra)}
    .av.user{background:var(--ink);color:#fff}
    .bbl{max-width:80%;padding:0.8rem 1.05rem;border-radius:0.9rem;font-size:0.9rem;line-height:1.65}
    .msg.ai .bbl{background:var(--sand);color:var(--ink)}
    .msg.user .bbl{background:var(--terra);color:#fff}
    .bbl.typing::after{content:'...';animation:dots 1.2s infinite}
    @keyframes dots{0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'}}
    .rec-cards{display:flex;flex-direction:column;gap:0.6rem;margin-top:0.75rem;max-width:95%}
    .rec-label{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0.5rem 0 0.2rem}
    .hotel-card{background:#fff;border:1px solid var(--brd);border-radius:0.85rem;overflow:hidden;transition:border-color 0.2s,transform 0.2s;animation:fadeUp 0.4s ease both}
    .hotel-card:hover{border-color:var(--terra);transform:translateX(3px)}
    .hotel-inner{display:flex}
    .hotel-img{width:88px;height:78px;object-fit:cover;flex-shrink:0;background:var(--sand)}
    .hotel-body{padding:0.6rem 0.85rem;flex:1;display:flex;flex-direction:column;justify-content:space-between}
    .hotel-top{display:flex;justify-content:space-between;align-items:flex-start}
    .hotel-name{font-weight:600;font-size:0.82rem;color:var(--ink);line-height:1.3}
    .hotel-stars{color:#F5A623;font-size:0.65rem;flex-shrink:0;margin-left:0.4rem}
    .hotel-desc{font-size:0.75rem;color:var(--muted);line-height:1.4;margin:0.2rem 0}
    .hotel-footer{display:flex;align-items:center;justify-content:space-between}
    .hotel-price{font-size:0.78rem;color:var(--green);font-weight:600}
    .hotel-btn{background:var(--terra);color:#fff;border:none;padding:0.22rem 0.7rem;border-radius:2rem;font-size:0.7rem;font-weight:500;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;white-space:nowrap}
    .hotel-btn:hover{background:#A8501F}
    .flight-card{background:#fff;border:1px solid var(--brd);border-radius:0.85rem;padding:0.7rem 1rem;transition:border-color 0.2s,transform 0.2s;animation:fadeUp 0.4s ease both}
    .flight-card:hover{border-color:#0770e3;transform:translateX(3px)}
    .flight-row{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
    .flight-code{font-size:1rem;font-weight:700;color:var(--ink)}
    .flight-city{font-size:0.68rem;color:var(--muted)}
    .flight-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.1rem}
    .flight-line{display:flex;align-items:center;gap:0.2rem;width:100%}
    .flight-dot{width:5px;height:5px;border-radius:50%;background:var(--brd);flex-shrink:0}
    .flight-dash{flex:1;height:1px;background:var(--brd)}
    .flight-dur{font-size:0.68rem;color:var(--muted)}
    .flight-foot{display:flex;align-items:center;justify-content:space-between;margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--brd)}
    .flight-airline{font-size:0.73rem;color:var(--muted)}
    .flight-price{font-size:0.78rem;color:var(--green);font-weight:600}
    .flight-btn{background:#0770e3;color:#fff;border:none;padding:0.22rem 0.7rem;border-radius:2rem;font-size:0.7rem;font-weight:500;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;white-space:nowrap}
    .flight-btn:hover{background:#055ab8}
    .sugs{display:flex;flex-wrap:wrap;gap:0.4rem;padding:1rem 1.25rem;border-top:1px solid var(--brd);background:#FDFCFA}
    .sug{background:none;border:1px solid var(--brd);padding:0.32rem 0.8rem;border-radius:2rem;font-family:'DM Sans',sans-serif;font-size:0.8rem;color:var(--muted);cursor:pointer;transition:all 0.2s}
    .sug:hover{border-color:var(--terra);color:var(--terra);background:var(--terra-light)}
    .inp-row{display:flex;border-top:1px solid var(--brd)}
    .inp{flex:1;border:none;padding:1rem 1.25rem;font-family:'DM Sans',sans-serif;font-size:0.95rem;background:#fff;color:var(--ink);outline:none;resize:none}
    .inp::placeholder{color:var(--muted)}
    .snd{background:var(--terra);color:#fff;border:none;padding:0 1.5rem;cursor:pointer;font-size:1.1rem;transition:background 0.15s}
    .snd:hover{background:#A8501F}
    .snd:disabled{background:var(--brd);cursor:not-allowed}
    .reveal{opacity:0;transform:translateY(28px);transition:opacity 0.65s ease,transform 0.65s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}
    .final-cta{background:var(--ink);color:#fff;padding:5rem 2.5rem;text-align:center}
    .final-cta-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3rem);font-weight:700;margin-bottom:1rem;line-height:1.1}
    .final-cta-title em{font-style:italic;color:#F0A882}
    .final-cta-sub{font-size:1rem;color:rgba(255,255,255,0.65);max-width:400px;margin:0 auto 2.5rem;line-height:1.7;font-weight:300}
    .final-cta-btn{background:var(--terra);color:#fff;border:none;padding:1rem 2.5rem;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;border-radius:3rem;cursor:pointer;transition:all 0.2s}
    .final-cta-btn:hover{background:#A8501F;transform:translateY(-2px)}
    .footer{background:#fff;border-top:1px solid var(--brd);padding:2rem 2.5rem;display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;color:var(--muted)}
    @media(max-width:768px){.hero{grid-template-columns:1fr}.hero-right{display:none}.hero-left{padding:3rem 1.5rem}.proof-bar{gap:1rem}.hero-stats{gap:1.25rem}.nav{padding:1rem 1.25rem}.footer{flex-direction:column;gap:0.5rem;text-align:center}}
  </style>
</head>
<body>
<nav class="nav">
  <div class="logo">Roamo<span>.</span></div>
  <button class="nav-cta" onclick="document.getElementById('chat').scrollIntoView({behavior:'smooth'})">Planlæg min rejse</button>
</nav>
<section class="hero">
  <div class="hero-left">
    <div class="hero-badge">★ Brugt af 2.400+ danskere</div>
    <h1 class="hero-title">Planlæg din drømmerejse<br><em>på 10 minutter</em></h1>
    <p class="hero-sub">Fortæl Roamo hvad du drømmer om. Vores AI finder hoteller og fly til dig — til alle destinationer i verden.</p>
